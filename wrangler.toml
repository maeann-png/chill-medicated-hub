# wrangler.toml
# Replace the name with your existing hub Worker's name (so it updates it, not creates a new one).
name = "sales-intelligence"
main = "src/index.js"
compatibility_date = "2026-07-03"

[assets]
directory = "."          # where your static files (index.html, logo, etc.) live — repo root here
binding = "ASSETS"        # lets the Worker serve assets via env.ASSETS.fetch()
run_worker_first = true   # run the auth check BEFORE serving any file
