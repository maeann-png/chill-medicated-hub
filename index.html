<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* ----------------------------------------------------------
       Chill Medicated brand palette — sampled directly from logo
       Cyan #0EB1E8 → Periwinkle #588BCD → Lavender Purple #8462AF
       ----------------------------------------------------------- */
    --bg-base:         #0a0e1a;
    --bg-deep:         #0e1224;
    --bg-card:         #16182f;
    --bg-card-hover:   #1d2040;
    --border:          #262a4a;
    --border-bright:   #3d4170;
    --text:            #e8ecf5;
    --text-soft:       #a8b0c8;
    --text-faint:      #6a7090;

    /* Brand gradient stops */
    --cyan:            #0EB1E8;
    --blue:            #4696D5;
    --periwinkle:      #588BCD;
    --lavender:        #7E67B5;
    --purple:          #8462AF;

    /* Functional accents */
    --accent:          var(--cyan);
    --accent-mid:      var(--periwinkle);
    --accent-deep:     var(--purple);
  }

  html, body {
    background: var(--bg-base);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 0%, rgba(14, 177, 232, 0.14) 0%, transparent 60%),
      radial-gradient(ellipse 70% 60% at 90% 90%, rgba(132, 98, 175, 0.18) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 50% 50%, rgba(88, 139, 205, 0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    pointer-events: none;
    opacity: 0.035;
    z-index: 1;
    mix-blend-mode: overlay;
  }

  .page {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 1360px;
    margin: 0 auto;
    padding: 40px 56px 32px;
  }

  /* ============ HEADER ============ */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 28px;
    margin-bottom: 56px;
    border-bottom: 1px solid var(--border);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .brand-logo {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: contain;
    filter: drop-shadow(0 2px 12px rgba(14, 177, 232, 0.25));
  }
  .brand-text {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }
  .brand-name {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .brand-name em {
    font-style: italic;
    font-weight: 400;
    background: linear-gradient(135deg, var(--cyan) 0%, var(--periwinkle) 50%, var(--purple) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .brand-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-top: 4px;
  }
  .nav-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  /* ============ HERO ============ */
  .hero {
    margin-bottom: 64px;
    max-width: 820px;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--cyan);
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .eyebrow::before {
    content: '';
    width: 32px;
    height: 1px;
    background: var(--cyan);
  }
  .hero-title {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: clamp(32px, 4.5vw, 56px);
    line-height: 1.02;
    letter-spacing: -0.025em;
    margin-bottom: 20px;
  }
  .hero-title em {
    font-style: italic;
    font-weight: 400;
    background: linear-gradient(135deg, var(--cyan) 0%, var(--periwinkle) 55%, var(--purple) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    line-height: 1.7;
    color: var(--text-soft);
    max-width: 600px;
    font-weight: 400;
  }

  /* ============ STATES GRID ============ */
  .states {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin-bottom: 56px;
  }
  @media (max-width: 1024px) {
    .states { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .states { grid-template-columns: 1fr; }
    .page { padding: 28px 22px 22px; }
    .nav { margin-bottom: 32px; }
    .hero { margin-bottom: 44px; }
  }

  .state {
    position: relative;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 36px 30px 28px;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    min-height: 365px;
    transition: all 380ms cubic-bezier(0.16, 1, 0.3, 1);
    overflow: hidden;
    cursor: pointer;
  }
  .state.disabled {
    cursor: default;
    opacity: 0.5;
  }

  .state-index {
    position: absolute;
    top: 22px;
    right: 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--text-faint);
  }

  .state::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--cyan), var(--periwinkle), var(--purple));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 540ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .state::after {
    content: '';
    position: absolute;
    bottom: -40%;
    right: -20%;
    width: 75%;
    height: 75%;
    background: radial-gradient(circle, rgba(14, 177, 232, 0.10) 0%, transparent 65%);
    opacity: 0;
    transition: opacity 540ms ease;
    pointer-events: none;
  }

  .state:not(.disabled):hover {
    background: var(--bg-card-hover);
    border-color: var(--border-bright);
    transform: translateY(-3px);
  }
  .state:not(.disabled):hover::before {
    transform: scaleX(1);
  }
  .state:not(.disabled):hover::after {
    opacity: 1;
  }

  .state-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--cyan);
    margin-top: auto;
    margin-bottom: 22px;
  }
  .state.disabled .state-code {
    color: var(--text-faint);
  }

  .state-name {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 34px;
    line-height: 1;
    letter-spacing: -0.02em;
    margin-bottom: 14px;
  }
  .state-name em {
    font-style: italic;
    font-weight: 400;
    background: linear-gradient(135deg, var(--cyan) 0%, var(--periwinkle) 60%, var(--purple) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .state.disabled .state-name em {
    background: none;
    -webkit-text-fill-color: var(--text-faint);
    color: var(--text-faint);
  }

  .state-tag {
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-soft);
    max-width: 240px;
    margin-bottom: 22px;
    font-weight: 300;
  }
  .state.disabled .state-tag {
    color: var(--text-faint);
  }

  /* ------- Stats block (replaces description for live states) ------- */
  .state-stats {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    margin-bottom: 22px;
  }
  .stat-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .stat-value {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 40px;
    letter-spacing: -0.01em;
    line-height: 1;
    color: var(--text);
  }
  .stat-value.gradient {
    background: linear-gradient(135deg, var(--cyan) 0%, var(--periwinkle) 60%, var(--purple) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .stat-value.loading {
    color: var(--text-faint);
    font-style: italic;
    font-size: 16px;
  }
  .stat-note {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.05em;
    color: var(--text-faint);
    margin-top: 2px;
  }

  .state-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: auto;
    align-self: stretch;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    position: relative;
    z-index: 1;
  }

  .state-cta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: color 280ms ease;
  }
  .state.disabled .state-cta {
    color: var(--text-faint);
  }
  .state-cta svg {
    width: 14px;
    height: 14px;
    transition: transform 280ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .state:not(.disabled):hover .state-cta {
    color: var(--cyan);
  }
  .state:not(.disabled):hover .state-cta svg {
    transform: translateX(4px);
  }

  .state-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-faint);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .state-status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-faint);
  }
  .state.live .state-status {
    color: var(--cyan);
  }
  .state.live .state-status .dot {
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  /* ============ FOOTER ============ */
  .footer {
    margin-top: auto;
    padding-top: 28px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-faint);
    flex-wrap: wrap;
    gap: 16px;
  }
  .footer-meta {
    display: flex;
    gap: 32px;
  }
  .footer-stat {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .footer-stat-num {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 14px;
    background: linear-gradient(135deg, var(--cyan) 0%, var(--periwinkle) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0;
    text-transform: none;
  }

  /* ============ ENTRANCE ANIMATIONS ============ */
  .nav, .hero, .states > *, .footer {
    animation: rise 700ms cubic-bezier(0.16, 1, 0.3, 1) backwards;
  }
  .nav { animation-delay: 0ms; }
  .hero { animation-delay: 100ms; }
  .states > *:nth-child(1) { animation-delay: 240ms; }
  .states > *:nth-child(2) { animation-delay: 320ms; }
  .states > *:nth-child(3) { animation-delay: 400ms; }
  .states > *:nth-child(4) { animation-delay: 480ms; }
  .footer { animation-delay: 600ms; }

  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
</head>

  <section class="hero">
    <div class="eyebrow">National Dashboard</div>
    <h1 class="hero-title">
      Sales intelligence,<br />
      <em>state by state.</em>
    </h1>
    <p class="hero-sub">
      Live visibility into orders, invoices, products, and buyer relationships across every market Chill Medicated operates in. Pick a state to drill in.
    </p>
  </section>

  <main class="states" id="states-grid"></main>

  <footer class="footer">
    <div class="footer-brand">© Chill Medicated</div>
    <div class="footer-meta">
      <div class="footer-stat">
        <span>Markets</span>
        <span class="footer-stat-num" id="footer-states">—</span>
      </div>
      <div class="footer-stat">
        <span>Live dashboards</span>
        <span class="footer-stat-num" id="footer-live">—</span>
      </div>
    </div>
  </footer>

</div>

<script>
  // ============================================================================
  // STATE CONFIGURATION
  // ============================================================================
  // To activate a state later: change `url: null` to the live dashboard URL.
  // The card will automatically become clickable and show "Live" status.
  // ============================================================================
  const STATES = [
    {
      code: 'MA',
      name: 'Massachusetts',
      url: 'https://chill-medicatedhub.github.io/apex-dashboard/dashboard.html',
      dataUrl: 'https://raw.githubusercontent.com/chill-medicatedhub/apex-dashboard/refs/heads/main/sales_data.json',
      histUrl: 'https://raw.githubusercontent.com/chill-medicatedhub/apex-dashboard/refs/heads/main/historical_data.json',
    },
    {
      code: 'NJ',
      name: 'New Jersey',
      url: 'https://chill-medicatedhub.github.io/apex-dashboard-newjersey/dashboard.html',
      dataUrl: 'https://raw.githubusercontent.com/chill-medicatedhub/apex-dashboard-newjersey/refs/heads/main/sales_data.json',
    },
    {
      code: 'MI',
      name: 'Michigan',
      url: 'https://chill-medicatedhub.github.io/apex-dashboard-michigan/dashboard.html',
      dataUrl: 'https://raw.githubusercontent.com/chill-medicatedhub/apex-dashboard-michigan/refs/heads/main/sales_data.json',
    },
    {
      code: 'MO',
      name: 'Missouri',
      url: 'https://chill-medicatedhub.github.io/apex-dashboard-missouri/dashboard.html',
      dataUrl: 'https://raw.githubusercontent.com/chill-medicatedhub/apex-dashboard-missouri/refs/heads/main/sales_data.json',
    },
  ];

  // --- Helpers --------------------------------------------------------
  const fmtMoney = (cents) => {
    const v = cents / 100;
    if (Math.abs(v) >= 1_000_000) return `$${(v / 1_000_000).toFixed(2)}M`;
    if (Math.abs(v) >= 1_000)     return `$${(v / 1_000).toFixed(1)}K`;
    return `$${v.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 })}`;
  };

  // Compute net revenue (cents) from a sales_data.json payload.
  // Mirrors the dashboard's logic: includes every row except samples.
  // Tax line items (e.g. "B2B 2% Tax") ARE included because they're real
  // dollars collected from buyers and the dashboard counts them too.
  function computeRevenueCents(payload) {
    if (!payload || !Array.isArray(payload.rows)) return 0;
    let cents = 0;
    for (const row of payload.rows) {
      // Sample detection: MA/NJ use an `is_sample` field; MO has none, so we
      // also catch SAMP/SAMPLE in the product name as a safety net (matches
      // the dashboards' own logic).
      const sample = row.is_sample;
      if (sample === true || (typeof sample === 'string' && /yes|true/i.test(sample))) continue;
      if (/samp(le)?/i.test(String(row.product_name || ''))) continue;
      // Line total, in CENTS. MA/NJ report it as `line_total_raw`; MO reports
      // it as `order_price` (e.g. 50625 = $506.25).
      if (row.line_total_raw != null || row.order_price != null) {
        const raw = (row.line_total_raw != null) ? row.line_total_raw : row.order_price;
        cents += Number(raw) || 0;
      } else if (row.gross != null) {
        // MI: mirror the Michigan dashboard's LeafLink-aligned net EXACTLY.
        // Net = gross minus the order's discount, but the discount only counts
        // once the order is "Complete" (pending/shipped show at gross until they
        // finalize). Do NOT use the feed's raw `revenue` field here — it's
        // computed differently and runs ~$138K low across the book, which made
        // the card read $21.17M while the dashboard read $21.31M.
        const gross = Number(row.gross) || 0;
        const complete = String(row.order_status || '').toLowerCase() === 'complete';
        const discount = complete ? (Number(row.discount) || 0) : 0;
        cents += Math.round((gross - discount) * 100);
      } else if (row.revenue != null) {
        // Fallback for any state that only carries a per-line `revenue` (dollars).
        cents += Math.round((Number(row.revenue) || 0) * 100);
      }
    }
    return cents;
  }

  // --- Render ---------------------------------------------------------
  const grid = document.getElementById('states-grid');
  let liveCount = 0;

  STATES.forEach((s, i) => {
    const isLive = !!s.url;
    if (isLive) liveCount++;

    const tag = isLive ? 'a' : 'div';
    const card = document.createElement(tag);
    card.className = 'state' + (isLive ? ' live' : ' disabled');
    if (isLive) {
      card.href = s.url;
      card.setAttribute('aria-label', `Open ${s.name} dashboard`);
    } else {
      card.setAttribute('aria-label', `${s.name} dashboard coming soon`);
    }

    const indexStr = String(i + 1).padStart(2, '0');

    // Italicize the last word of the name for editorial flair
    const nameParts = s.name.split(' ');
    const nameHtml = nameParts.length > 1
      ? `${nameParts[0]} <em>${nameParts.slice(1).join(' ')}</em>`
      : `<em>${s.name}</em>`;

    // Different inner content for live vs. coming-soon cards
    const statsBlock = isLive
      ? `
        <div class="state-stats">
          <div class="stat-row">
            <div class="stat-label">Net Revenue</div>
            <div class="stat-value loading" data-stat="revenue" data-code="${s.code}">Loading…</div>
          </div>
        </div>
      `
      : `
        <div class="state-tag">
          Sales intelligence dashboard for the ${s.name} market.
        </div>
      `;

    card.innerHTML = `
      <div class="state-index">${indexStr}</div>
      <div class="state-code">${s.code}</div>
      <div class="state-name">${nameHtml}</div>
      ${statsBlock}
      <div class="state-footer">
        <div class="state-cta">
          ${isLive ? 'Open dashboard' : 'Coming soon'}
          ${isLive ? `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          ` : ''}
        </div>
        <div class="state-status">
          <span class="dot"></span>
          <span>${isLive ? 'Live' : 'Pending'}</span>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  document.getElementById('footer-states').textContent = String(STATES.length).padStart(2, '0');
  document.getElementById('footer-live').textContent = String(liveCount).padStart(2, '0');

  // --- Fetch live numbers --------------------------------------------
  // For each live state, fetch sales_data.json, compute net revenue,
  // and update the card. We cache-bust with a timestamp so we always
  // see fresh data on page load.
  STATES.forEach(s => {
    if (!s.dataUrl) return;
    // MA also carries a historical_data.json backfill; the dashboard merges it
    // into its totals, so the hub card must include it too (or it reads low).
    const urls = s.histUrl ? [s.dataUrl, s.histUrl] : [s.dataUrl];
    const fetches = urls.map(u => {
      const bust = u + (u.includes('?') ? '&' : '?') + 't=' + Date.now();
      return fetch(bust).then(r => (r.ok ? r.json() : { rows: [] })).catch(() => ({ rows: [] }));
    });
    Promise.all(fetches)
      .then(payloads => {
        const revenueCents = payloads.reduce((sum, p) => sum + computeRevenueCents(p), 0);
        const revEl = document.querySelector(`[data-stat="revenue"][data-code="${s.code}"]`);
        if (revEl)  { revEl.textContent = fmtMoney(revenueCents); revEl.classList.remove('loading'); revEl.classList.add('gradient'); }
      })
      .catch(err => {
        console.warn(`Could not load ${s.code} data:`, err);
        const revEl = document.querySelector(`[data-stat="revenue"][data-code="${s.code}"]`);
        if (revEl)  { revEl.textContent = 'N/A'; revEl.classList.remove('loading'); }
      });
  });
</script>
